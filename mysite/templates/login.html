{% extends "base.html" %}
{% block content %}
<h1>Login</h1>
<p class="muted">Demo accounts: `student1`, `employer1`, `admin1` with password `Password123`.</p>
{% if username_invalid %}<p class="error">Username not found.</p>{% endif %}
{% if password_invalid %}<p class="error">Password is incorrect.</p>{% endif %}
<form method="post">
    <label>Username</label>
    <input name="username" value="{{ username or '' }}" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Login</button>
</form>
{% endblock %}
