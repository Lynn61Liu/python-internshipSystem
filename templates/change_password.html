{% extends 'userbase.html' %} {% block title %}Change Password{% endblock %} {%
set active_page = 'change_password' %} {% block content %}

<section class="container py-4 py-lg-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 content-panel p-4 p-lg-5">
      <p class="hero-kicker mb-2">Security</p>
      <h3 class="fw-bold">Change Password</h3>
      <form
        method="POST"
        action="{{ url_for('change_password') }}"
        class="needs-validation"
        novalidate
      >
        <div class="mb-3">
          <label for="current_password" class="form-label"
            >Current Password</label
          >
          <input
            type="password"
            class="form-control"
            id="current_password"
            name="current_password"
            required
          />
          <div class="invalid-feedback">
            Please enter your current password.
          </div>
        </div>

        <div class="mb-3">
          <label for="new_password" class="form-label">New Password</label>
          <input
            type="password"
            class="form-control"
            id="new_password"
            name="new_password"
            required
          />
          <div class="invalid-feedback">Please enter a valid new password.</div>
        </div>

        <div class="mb-3">
          <label for="confirm_password" class="form-label"
            >Confirm New Password</label
          >
          <input
            type="password"
            class="form-control"
            id="confirm_password"
            name="confirm_password"
            required
          />
          <div class="invalid-feedback">Passwords do not match.</div>
          <div class="valid-feedback">Passwords match!</div>
        </div>

        <button type="submit" class="btn btn-warning" id="submit-btn" disabled>
          <i class="bi bi-shield-check"></i>Update Password
        </button>
      </form>
    </div>
  </div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.querySelector(".needs-validation");
    const newPw = document.getElementById("new_password");
    const confirmPw = document.getElementById("confirm_password");
    const submitBtn = document.getElementById("submit-btn");

    function checkMatch() {
      const newVal = newPw.value;
      const confirmVal = confirmPw.value;

      if (!newVal || !confirmVal) {
        confirmPw.classList.remove("is-valid", "is-invalid");
        submitBtn.disabled = true;
        return;
      }

      if (newVal === confirmVal) {
        confirmPw.classList.remove("is-invalid");
        confirmPw.classList.add("is-valid");
        submitBtn.disabled = false;
      } else {
        confirmPw.classList.remove("is-valid");
        confirmPw.classList.add("is-invalid");
        submitBtn.disabled = true;
      }
    }

    newPw.addEventListener("input", checkMatch);
    confirmPw.addEventListener("input", checkMatch);
    confirmPw.addEventListener("blur", checkMatch);

    form.addEventListener("submit", function (event) {
      if (!form.checkValidity() || newPw.value !== confirmPw.value) {
        event.preventDefault();
        event.stopPropagation();
      }
      form.classList.add("was-validated");
    });
  });
</script>
{% endblock %}
